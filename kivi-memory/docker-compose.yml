services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kivi
      POSTGRES_PASSWORD: kivi
      POSTGRES_DB: kivi_memory
    ports:
      - "5432:5432"
    volumes:
      - kivi_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kivi -d kivi_memory"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kivi_data:
